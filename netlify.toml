# Beach Day: Netlify config. No secrets here (Functions can't see toml env vars, and this file is in Git).
# Environment variables are set in the Netlify UI; see .env.example.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Built by scripts/build-agents.mjs (git-ignored); bundle the JSON next to the Functions.
  included_files = ["netlify/functions/_generated/*.json"]

[dev]
  framework = "#custom"
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# NOTE: custom headers apply only to static files, NOT to Function responses.
# Every Function sets its own Cache-Control / nosniff / security headers.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    # connect-src may be tightened to the exact Supabase origin: scripts/check-secrets.mjs
    # appends a dist/_headers override from VITE_SUPABASE_URL at build time.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/agents/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/login/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
