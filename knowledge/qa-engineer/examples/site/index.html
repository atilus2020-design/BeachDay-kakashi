<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Beach Day test page</title>
<style>body{margin:0;font:16px system-ui;background:#fff;color:#111}main{padding:16px}button{min-height:44px;min-width:44px}</style></head>
<body><main><h1>South Beach</h1><p id="score" aria-live="polite">Loading…</p><button id="refresh">Refresh</button></main>
<script>
async function load(){ try { const r = await fetch('/api/forecast?beach=south-beach'); const d = await r.json(); document.getElementById('score').textContent = `${d.score} · ${d.label}`; } catch { document.getElementById('score').textContent = 'Offline — showing saved forecast'; } }
document.getElementById('refresh').onclick = load; load();
</script></body></html>
